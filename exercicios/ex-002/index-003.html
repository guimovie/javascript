<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro exercício</title>
    <style>
        body {
            background-color: #5D609D;
            color: aquamarine;
            font: normal normal 1.5em helvetica;
        }
    </style>
</head>
<body>

    <script>
        var nome = window.prompt('Qual seu nome?')
        document.write(`Olá <strong>${nome}</strong>, seu nome tem ${nome.length} letras </br>`)
        document.write(`Seu nome em maiúsculo fica ${nome.toUpperCase()} </br>`)
        document.write(`E em minúsculo fica ${nome.toLowerCase()} </br>`)
    </script>
</body>
</html>
