<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analise de números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analizador de Números</h1>
    </header>
    <main>
        <div id="num">
            <label for="numero">Número (entre 1 e 100): </label>
            <input type="number" name="numero" id="numero" min="1" max="100">
            <input type="button" value="Adicionar" onclick="add()">
        </div>
        <div id="lista">Lista:</div>
        <input type="button" value="Finalizar" onclick="final()">
        <div id="res"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
