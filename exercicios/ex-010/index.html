<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Show de Bola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contador</h1>
    </header>
    <main>
        <div id="info">
            <p>
                <label for="inicio">Inicio:</label>
                <input type="number" name="inicio" id="inicio" max="100">
            </p>
            <p>
                <label for="fim">Fim:</label>
                <input type="number" name="fim" id="fim" max="100">
            </p>
            <p>
                <label for="passo">Passo:</label>
                <input type="number" name="passo" id="passo" min="1" max="10">
            </p>
            <input id="btn" type="button" value="Contar" onclick="contar()">
        </div>
        <div id="res">
            Preparando a contagem...
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
