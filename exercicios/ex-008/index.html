<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <header>
        <h1>Verificador de idade</h1>
    </header>
    <main>
        <label for="ano">Ano de Nascimento:</label>
        <input type="number" name="ano" id="ano" min="1900">
        <p>Sexo: 
            <input type="radio" name="sexo" id="m" >
            <label for="m">Masculino</label>
            <input type="radio" name="sexo" id="f">
            <label for="f">Feminino</label>
        </p>
        <input id="btn" type="button" value="Verificar" onclick="verificar()">
        <p id="result">Preencha os campos acima para obter o resultado.</p>
        <div id="img"></div>
    </main>

    <script src="scripts/script.js"></script>
</body>
</html>
