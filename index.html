<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de DOM</title>
    <style>
        body {
            background-color: blueviolet;
            color: white;
            font: normal normal 1.2em arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usaar <strong>DOM</strong> em JavaScript</p>
    <div id="msg">Clique Aqui</div>

    <script>
        var body = window.document.body
        var p = window.document.getElementsByTagName('p') [0]
        var btn = window.document.getElementById('msg')
        btn.style.background = 'black'
        body.style.background = 'gray'
        window.document.write('</br> Estava escito: ' + p.innerText)
    </script>
</body>
</html>
